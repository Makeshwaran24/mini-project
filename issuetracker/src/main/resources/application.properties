# ============================================
# File: backend/src/main/resources/application.properties
# This file configures how Spring Boot connects
# to your MySQL database and sets up JPA.
# ============================================

# --- Database Connection ---
# Replace 'root' and 'yourpassword' with your MySQL credentials
spring.datasource.url=jdbc:mysql://localhost:3306/issue_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Settings ---
# 'update' = auto-create or update tables based on your Entity class
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- App Port ---
server.port=8080

# --- Allow React frontend (localhost:3000) to call this backend ---
# CORS is handled in the Controller, but we name the app here
spring.application.name=issue-tracker